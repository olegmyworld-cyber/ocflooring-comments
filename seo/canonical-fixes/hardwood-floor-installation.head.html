<template id="ocld-b">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Which cities does OC Flooring install hardwood floors in?","acceptedAnswer":{"@type":"Answer","text":"We install across King, Snohomish and Island County — Seattle and the Eastside, the Lynnwood–Everett corridor, and out to Whidbey Island. Every city we serve is linked above, and travel is always included in your written quote."}},{"@type":"Question","name":"Do you supply the hardwood, or can I provide my own?","acceptedAnswer":{"@type":"Answer","text":"Either works. Most clients have us supply materials through our product lines so one warranty covers everything, but if you've already purchased flooring, we'll inspect it, let it acclimate properly, and install it at the same labor rates."}},{"@type":"Question","name":"How is hardwood installation priced?","acceptedAnswer":{"@type":"Answer","text":"Labor runs $3–$4.25 per square foot depending on the method your subfloor needs (nail-down, glue-down, or floating). Materials, stairs, and old-floor removal are itemized separately in the written quote, so nothing is bundled or hidden."}},{"@type":"Question","name":"What does the free in-home estimate include?","acceptedAnswer":{"@type":"Answer","text":"We measure every room, check subfloor moisture and flatness with a meter, talk through species and finish options, and leave you a firm written price — not a range that grows later. It takes about 45 minutes and there's no obligation."}},{"@type":"Question","name":"Does OC Flooring offer financing on installation?","acceptedAnswer":{"@type":"Answer","text":"Yes — financing is available on installation projects, and we'll walk you through the options during your estimate so you can compare monthly-payment routes against paying outright."}},{"@type":"Question","name":"What does the 1-year workmanship warranty cover?","acceptedAnswer":{"@type":"Answer","text":"Anything traceable to our installation work — squeaks from fastening, gaps from rushed acclimation, transitions, trim. If it's our workmanship, we come back and make it right at no charge. Manufacturer warranties cover the flooring itself."}}]}</template>
