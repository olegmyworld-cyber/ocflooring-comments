<div data-rt-embed-type='true'><script>
(function(){try{
var els=document.querySelectorAll('.ocb-card,.ocb-fact,.ocb-tri,.faq-item');
if(!('IntersectionObserver' in window)||!els.length)return;
document.documentElement.classList.add('ocb-anim-ready');
els.forEach(function(e,i){e.classList.add('ocb-rv');e.style.transitionDelay=Math.min((i%6)*70,350)+'ms'});
var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add('ocb-in');io.unobserve(x.target)}})},{threshold:.12,rootMargin:'0px 0px -8% 0px'});
els.forEach(function(e){io.observe(e)});
}catch(e){}})();
</script></div>
