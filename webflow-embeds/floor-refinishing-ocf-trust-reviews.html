<!-- OC Flooring — HTML Embed placed on /flooring-services-near-me/floor-refinishing,
     immediately before (and replacing) the old "Section // Reviews" Trustindex widget.
     Markup is the same #ocf-trust section used on the home page and the city
     hardwood-floor-refinishing-in-* pages (which keep it in page footer custom code).
     The home page's trailing <div class="map-wrap"> map iframe is omitted here — the
     home page hides it at runtime via the OCRemoveHomeMap script anyway. -->
<style id="ocf-trust-css">
#ocf-trust{--navy:#0c1f3f;--navy-soft:#16315c;--red:#be1e2d;--red-dark:#9c1623;--paper:#f6f2ec;--line:#e7e0d6;--muted:#6a7180;--gold:#d8a24a;font-family:'Mulish',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c2433;background:var(--paper);padding:48px 22px;-webkit-font-smoothing:antialiased}
#ocf-trust *,#ocf-trust *::before,#ocf-trust *::after{box-sizing:border-box;margin:0;padding:0}
#ocf-trust .ocf-wrap{max-width:1080px;margin:0 auto}
#ocf-trust .lic-bar{background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:16px 22px;flex-wrap:wrap;box-shadow:0 18px 40px -18px rgba(12,31,63,.30),0 2px 8px -2px rgba(12,31,63,.10)}
#ocf-trust .lic-badges{display:flex;gap:10px;flex-wrap:wrap;list-style:none}
#ocf-trust .lic-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:#fff}
#ocf-trust .lic-chip svg{width:15px;height:15px;color:#9fd3b4}
#ocf-trust .lic-verify{margin-left:auto;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
#ocf-trust .lic-label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9bb0cf}
#ocf-trust .lic-no{font-weight:900;font-size:16px;letter-spacing:.04em;color:#fff}
#ocf-trust .lic-link{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);font-weight:800;font-size:13px;padding:8px 14px;border-radius:9px;text-decoration:none;white-space:nowrap;transition:background .15s}
#ocf-trust .lic-link svg{width:14px;height:14px}
#ocf-trust .lic-link:hover{background:#eef2f8}
#ocf-trust .rev-head{display:flex;align-items:center;justify-content:space-between;gap:12px 18px;flex-wrap:wrap;margin:38px 0 26px}
#ocf-trust .rev-head>.rh-l{flex:1 1 300px;min-width:0}
#ocf-trust .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
#ocf-trust .eyebrow::before{content:'';width:24px;height:2px;background:var(--red);border-radius:2px}
#ocf-trust h2.ocf-h{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:700;color:var(--navy);font-size:clamp(23px,3.4vw,32px);line-height:1.12;letter-spacing:-.01em;margin-top:8px}
#ocf-trust h2.ocf-h em{font-style:italic;color:var(--navy-soft)}
#ocf-trust .rev-rating{flex:0 0 auto;display:flex;align-items:center;gap:10px}
#ocf-trust .rev-rating .big{font-family:'Playfair Display',Georgia,serif;font-size:38px;font-weight:700;color:var(--navy);line-height:1}
#ocf-trust .stars{color:var(--gold);font-size:17px;letter-spacing:2px}
#ocf-trust .rev-rating .cnt{font-size:12.5px;color:var(--muted);font-weight:700}
#ocf-trust .rev-rating .gwrap{display:flex;align-items:center;gap:8px}
#ocf-trust .rev-rating .gwrap svg{width:20px;height:20px}
#ocf-trust .rev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
#ocf-trust figure.rev{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px -4px rgba(12,31,63,.12);display:flex;flex-direction:column}
#ocf-trust .ph-img{aspect-ratio:16/10;background-size:cover;background-position:center;background-color:#e7ded0;background-repeat:no-repeat}
#ocf-trust figure.rev.no-photo{background:#fff;border-color:var(--line)}
#ocf-trust .no-photo .qtop{font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-size:66px;line-height:.6;padding:20px 18px 0}
#ocf-trust .no-photo .rev-body{padding-top:8px}
#ocf-trust .no-photo blockquote{color:#3a4151}
#ocf-trust .rev-body{padding:16px 17px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
#ocf-trust .rev .stars{font-size:14px}
#ocf-trust .rev blockquote{font-size:13px;color:#3a4151;line-height:1.55;flex:1;border:0}
#ocf-trust figcaption.who{display:flex;align-items:center;gap:10px}
#ocf-trust .av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
#ocf-trust .nm{font-weight:800;color:var(--navy);font-size:13px;line-height:1.2;font-style:normal}
#ocf-trust .nm span{display:block;font-weight:600;color:var(--muted);font-size:11px}
#ocf-trust .gicon{margin-left:auto;width:18px;height:18px;flex:none}
#ocf-trust .rev-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
#ocf-trust .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;border-radius:11px;background:var(--red);color:#fff;font-weight:800;font-size:14.5px;text-decoration:none;box-shadow:0 10px 22px -10px rgba(190,30,45,.7);transition:background .15s}
#ocf-trust .gbtn:hover{background:var(--red-dark)}
#ocf-trust .gbtn svg{width:18px;height:18px}
#ocf-trust .rev-foot .note{font-size:12px;color:var(--muted)}
@media(max-width:1024px){#ocf-trust .rev-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:767px){#ocf-trust .rev-grid{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:14px!important;width:auto!important;max-width:none!important;padding-bottom:12px!important;scrollbar-width:none}
#ocf-trust .rev-grid::-webkit-scrollbar{display:none}
#ocf-trust .rev-grid>.rev{flex:0 0 85%!important;width:85%!important;max-width:85%!important;min-width:0!important;margin:0!important;scroll-snap-align:center}}
@media(max-width:560px){#ocf-trust{padding:40px 16px}#ocf-trust .lic-verify{margin-left:0;width:100%}}
</style>
