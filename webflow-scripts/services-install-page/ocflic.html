<style id="ocf-lic-css">
#ocf-lic{--navy:#0c1f3f;--red:#be1e2d;--paper:#f6f2ec;font-family:'Mulish',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--paper);padding:34px 22px}
#ocf-lic *{box-sizing:border-box;margin:0;padding:0}
#ocf-lic .w{max-width:1080px;margin:0 auto}
#ocf-lic .bar{background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;box-shadow:0 18px 40px -18px rgba(12,31,63,.30),0 2px 8px -2px rgba(12,31,63,.10)}
#ocf-lic .badges{display:flex;gap:10px;flex-wrap:wrap;list-style:none}
#ocf-lic .chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:#fff}
#ocf-lic .chip svg{width:15px;height:15px;color:#9fd3b4}
#ocf-lic .verify{margin-left:auto;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
#ocf-lic .lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9bb0cf}
#ocf-lic .no{font-weight:900;font-size:16px;letter-spacing:.04em;color:#fff}
#ocf-lic .link{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);font-weight:800;font-size:13px;padding:8px 14px;border-radius:9px;text-decoration:none;white-space:nowrap}
#ocf-lic .link svg{width:14px;height:14px}
#ocf-lic .link:hover{background:#eef2f8}
#ocf-lic .rate{display:flex;align-items:center;justify-content:center;gap:9px;margin:14px 0 0;flex-wrap:wrap}
#ocf-lic .rate a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#16315c;font-weight:700;font-size:14px;background:#fff;border:1px solid #e1d9c9;border-radius:999px;padding:9px 17px;transition:border-color .15s,box-shadow .15s}
#ocf-lic .rate a:hover{border-color:var(--red);box-shadow:0 2px 10px rgba(190,30,45,.12)}
#ocf-lic .rate .st{color:#f5a623;letter-spacing:1px}
#ocf-lic .rate b{color:#0c1f3f;font-weight:900}
#ocf-lic .rate .arr{color:var(--red);font-weight:800;margin-left:2px}
@media(max-width:640px){#ocf-lic{padding:26px 16px}#ocf-lic .verify{margin-left:0;width:100%}}
</style>
