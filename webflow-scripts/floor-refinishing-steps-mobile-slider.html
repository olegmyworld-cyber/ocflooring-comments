<!-- OC Flooring — mobile slider for the 6-step refinishing process (#oc-steps) -->
<div class="oc-steps-nav">
  <div class="oc-steps-dots" id="oc-steps-dots"></div>
</div>

<style>
.oc-steps-nav { display: none; }

@media screen and (max-width: 767px) {
  .oc-steps-nav { display: block; }

  #oc-steps {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    align-items: stretch !important;
    gap: 0.875rem !important;
    grid-column-gap: 0.875rem !important;
    grid-row-gap: 0rem !important;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-top: 0.375rem;
    padding-bottom: 0.625rem;
  }
  #oc-steps::-webkit-scrollbar { display: none; width: 0; height: 0; }

  #oc-steps > .services-item-wpapper {
    flex: 0 0 84%;
    width: 84%;
    max-width: 84%;
    min-width: 0;
    scroll-snap-align: center;
    padding: 0 !important;
    gap: 0 !important;
    grid-column-gap: 0 !important;
    grid-row-gap: 0 !important;
    align-items: stretch !important;
    text-align: left;
    border-radius: 1rem;
    overflow: hidden;
    box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
  }

  #oc-steps .services-image {
    width: 100%;
    max-width: none;
    height: 11rem;
    object-fit: cover;
    border-radius: 0;
    margin: 0 !important;
  }

  #oc-steps .h3-heading {
    margin: 1rem 1.125rem 0.5rem;
    font-size: 1.25rem;
    line-height: 1.3;
    text-align: left !important;
  }

  #oc-steps .h3-heading br { display: none; }

  #oc-steps .oc-step-badge {
    display: block;
    width: -moz-fit-content;
    width: fit-content;
    margin-bottom: 0.625rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    background-color: var(--oc-accent, #c0392f);
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  #oc-steps .services-description {
    margin: 0 1.125rem 1.25rem;
    font-size: 0.95rem;
    line-height: 1.55;
    text-align: left !important;
  }

  .oc-steps-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .oc-steps-dots .oc-dot {
    width: 0.5rem;
    height: 0.5rem;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background-color: rgba(0, 0, 0, 0.18);
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    transition: width 0.25s ease, background-color 0.25s ease;
  }
  .oc-steps-dots .oc-dot.is-active {
    width: 1.5rem;
    background-color: var(--oc-accent, #c0392f);
  }
}

@media screen and (min-width: 480px) and (max-width: 767px) {
  #oc-steps > .services-item-wpapper { flex-basis: 46%; width: 46%; max-width: 46%; }
  #oc-steps .services-image { height: 12rem; }
}
</style>

<script>
(function () {
  function init() {
    var wrap = document.getElementById('oc-steps');
    var dots = document.getElementById('oc-steps-dots');
    if (!wrap || !dots) return;

    // Pick up the site's accent colour so the badge and dots always match the brand.
    try {
      var ref = document.querySelector('.line-red');
      if (ref) {
        var c = window.getComputedStyle(ref).backgroundColor;
        if (c && c !== 'rgba(0, 0, 0, 0)' && c !== 'transparent') {
          document.documentElement.style.setProperty('--oc-accent', c);
        }
      }
    } catch (e) {}

    var cards = [].slice.call(wrap.querySelectorAll('.services-item-wpapper'));
    if (!cards.length) return;

    // Turn the "Step N" line of each heading into a pill badge.
    cards.forEach(function (card) {
      var h = card.querySelector('.h3-heading');
      if (!h || h.querySelector('.oc-step-badge')) return;
      var node = h.firstChild;
      while (node && node.nodeType === 3 && !node.nodeValue.trim()) node = node.nextSibling;
      if (!node || node.nodeType !== 3 || !/^\s*step\s*\d+/i.test(node.nodeValue)) return;
      var badge = document.createElement('span');
      badge.className = 'oc-step-badge';
      badge.textContent = node.nodeValue.trim();
      h.replaceChild(badge, node);
    });

    function centerOf(card) {
      var wr = wrap.getBoundingClientRect();
      var cr = card.getBoundingClientRect();
      return cr.left - wr.left + wrap.scrollLeft + cr.width / 2;
    }

    var buttons = cards.map(function (card, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'oc-dot';
      b.setAttribute('aria-label', 'Go to step ' + (i + 1));
      b.addEventListener('click', function () {
        var left = centerOf(card) - wrap.clientWidth / 2;
        if (wrap.scrollTo) wrap.scrollTo({ left: left, behavior: 'smooth' });
        else wrap.scrollLeft = left;
      });
      dots.appendChild(b);
      return b;
    });

    function update() {
      var mid = wrap.scrollLeft + wrap.clientWidth / 2;
      var best = 0, bestDist = Infinity;
      cards.forEach(function (card, i) {
        var d = Math.abs(centerOf(card) - mid);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      if (wrap.scrollLeft <= 2) best = 0;
      else if (wrap.scrollLeft >= wrap.scrollWidth - wrap.clientWidth - 2) best = cards.length - 1;
      buttons.forEach(function (b, i) {
        if (i === best) b.classList.add('is-active');
        else b.classList.remove('is-active');
      });
    }

    var frame;
    wrap.addEventListener('scroll', function () {
      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(update);
    }, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
